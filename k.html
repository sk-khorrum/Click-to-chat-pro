<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>WAChat Direct | Tool by SK Khorrum</title>
    <meta name="description" content="Official WhatsApp Direct Chat Tool by SK Khorrum. Professional, Fast, and Secure.">
    <meta name="keywords" content="SK Khorrum, WhatsApp Direct, Chat without saving number, SK Khorrum Apps">
    <meta name="author" content="SK Khorrum">

    <link rel="manifest" href='data:application/json,{"name":"SK WhatsApp Direct","short_name":"SKChat","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#10b981","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/124/124034.png","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 3D Glass Effect */
        .card-3d {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(16, 185, 129, 0.1);
            transition: 0.5s ease;
        }

        .card-3d:hover {
            transform: translateY(-10px) rotateX(5deg);
            border-color: rgba(16, 185, 129, 0.5);
        }

        /* Neon Glow Button */
        .neon-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            transition: 0.3s;
        }

        .neon-btn:hover {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
            transform: scale(1.02);
        }

        .input-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            transition: 0.3s;
        }

        .input-box:focus {
            border-color: #10b981;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }
    </style>
</head>
<body>

    <div id="install-banner" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden">
        <button id="install-button" class="bg-green-600 text-white px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2 animate-bounce">
            <i data-lucide="download"></i> INSTALL SK APP
        </button>
    </div>

    <div class="w-full max-w-md p-6">
        <div class="card-3d p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-tighter">SK <span class="text-green-500">KHORRUM</span></h1>
                <p class="text-gray-500 text-xs mt-1 uppercase tracking-widest">WhatsApp Direct Engine</p>
            </div>

            <div class="space-y-6">
                <div class="flex gap-3">
                    <div class="w-1/3">
                        <label class="text-[10px] text-gray-500 ml-2">PREFIX</label>
                        <input type="text" id="prefix" value="880" class="input-box w-full p-3 text-center text-lg font-bold">
                    </div>
                    <div class="flex-1">
                        <label class="text-[10px] text-gray-500 ml-2">NUMBER</label>
                        <input type="tel" id="number" placeholder="1XXX-XXXXXX" class="input-box w-full p-3 text-lg tracking-widest">
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex gap-2">
                        <input type="text" id="new-tmp" placeholder="New template..." class="input-box flex-1 p-2 text-sm">
                        <button onclick="addMsg()" class="bg-green-600 p-2 rounded-xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="list" class="max-h-32 overflow-y-auto space-y-2 pr-2"></div>
                </div>

                <button onclick="goChat()" class="neon-btn w-full py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2">
                    START CHAT <i data-lucide="zap"></i>
                </button>
            </div>
        </div>

        <p class="text-center mt-6 text-gray-600 text-sm">
            Powered by <a href="https://www.google.com/search?q=SK+Khorrum" target="_blank" class="text-green-800 font-bold hover:text-green-500 transition">SK Khorrum</a>
        </p>
    </div>

    <script>
        // 1. Service Worker for PWA (Browser-e install prompt anar jonno)
        const sw = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([sw], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl);
        }

        // 2. Install Prompt Logic
        let deferredPrompt;
        const banner = document.getElementById('install-banner');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            banner.classList.remove('hidden');
        });

        document.getElementById('install-button').onclick = () => {
            banner.classList.add('hidden');
            deferredPrompt.prompt();
        };

        // 3. App Logic
        let msgs = JSON.parse(localStorage.getItem('sk_msgs')) || [{txt: "Hi, how are you?"}];

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = '';
            msgs.forEach((m, i) => {
                list.innerHTML += `
                    <div class="flex items-center gap-2 bg-white/5 p-2 rounded-lg border border-white/5">
                        <input type="checkbox" class="msg-check w-4 h-4 accent-green-500" value="${m.txt}">
                        <span class="text-xs text-gray-300 flex-1 truncate">${m.txt}</span>
                        <button onclick="delMsg(${i})" class="text-red-500/50 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function addMsg() {
            const val = document.getElementById('new-tmp').value;
            if(!val) return;
            msgs.push({txt: val});
            localStorage.setItem('sk_msgs', JSON.stringify(msgs));
            document.getElementById('new-tmp').value = '';
            render();
        }

        function delMsg(i) {
            msgs.splice(i, 1);
            localStorage.setItem('sk_msgs', JSON.stringify(msgs));
            render();
        }

        function goChat() {
            const p = document.getElementById('prefix').value;
            const n = document.getElementById('number').value.replace(/\D/g,'');
            if(!n) return alert("Number den!");

            let sel = [];
            document.querySelectorAll('.msg-check:checked').forEach(c => sel.push(c.value));
            
            const url = `https://wa.me/${p}${n}?text=${encodeURIComponent(sel.join('\n'))}`;
            window.open(url, '_blank');
        }

        window.onload = render;
    </script>
</body>
</html>
